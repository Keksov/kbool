      # what macOS libc's ERE does with each word-edge spelling (tiny, bounded)
      - name: D8b raw ERE word edges (read-only)
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          b="$(brew --prefix)/bin/bash"
          cat > "$RUNNER_TEMP/raw.sh" <<'RAW'
          p() { local re=$1 t=$2; [[ $t =~ $re ]] 2>/dev/null; printf '%-44s %-10s rc=%s [%s]\n' "$re" "'$t'" "$?" "${BASH_REMATCH[*]}"; }
          for t in 'a foo b' 'afoob' 'ab' 'xb y'; do
            p '\b' "$t"; p '\bfoo\b' "$t"; p '\<foo\>' "$t"; p '[[:<:]]foo[[:>:]]' "$t"
            p '([[:<:]]|[[:>:]])foo([[:<:]]|[[:>:]])' "$t"; p '([[:<:]]|[[:>:]])foo' "$t"; p 'foo([[:<:]]|[[:>:]])' "$t"
            p '[[:<:]]foo' "$t"; p 'foo[[:>:]]' "$t"; p '\b.' "$t"
          done
          p '(a)\1' 'aa'; p '(x|y)(a)\2' 'xaa'; p '[[:<:]]x(a)\1' 'z xaa'
          p '[[:<:]][a-z]+[[:>:]]' 'ab, cd'; p 'a[[:<:]]b' 'ab'
          echo "BASH_VERSION=$BASH_VERSION LANG=${LANG-} LC_ALL=${LC_ALL-} LC_CTYPE=${LC_CTYPE-}"
          RAW
          "$b" "$RUNNER_TEMP/raw.sh"
          true

      - name: D8c tregex 002 005 011 015 directly (brew bash, verbose)
        timeout-minutes: 10
        shell: bash
        env:
          GNUBIN: ${{ matrix.gnubin }}
        run: |
          set +e
          b="$(brew --prefix)/bin/bash"
          if [ "$GNUBIN" = yes ]; then PATH="$PATH:$(brew --prefix coreutils)/libexec/gnubin"; export PATH; fi
          for t in 002_IsMatch 005_FlagsAndForkFree 011_T3_T4_LocaleAndAnchors 015_WordEdges; do
