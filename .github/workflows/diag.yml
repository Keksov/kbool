# Read-only diagnostics of launch L5.4 (docs/dev/launch/L5_triage.md §6: D1 macOS,
# D2 ubuntu host, D3 windows; D4 windows = SV-1: ktests 057's suspend in each
# runtime, and 057 itself; D5 = the time of its powershell call per env;
# D6 = 057 and the ktests gate with SV-1's uncommitted fix applied;
# D7 = L5.4-13 macOS: lsof output of a pipe's two ends and of a cwd, the 052
# sampler's pace, ktests 045 and 052 run directly, optionally with a patch;
# D8 = L5.4-12b macOS: raw ERE word edges, kcl/tregex 002/005/011/015 and the
# kcl/tregex gate with the uncommitted kcl patch);
# D9 = L5.4-14 macOS: every kklass test file run directly with a bound (rc, time,
# the process tree of a hung one), the kklass suite threaded, and the kklass gate,
# optionally with an uncommitted kklass/tests patch);
# D10 = L5.8 windows git-bash: which ktests file leaves the orphan /usr/bin/bash
# (sampled process table, the ktests suite x5 and the ktests gate x2, optionally
# with an uncommitted ktests patch);
# D11 = L5.9 windows (both rows): the cygwin FIFO wedge of the runner's group start
# (a stress reproducer with wedge dumps, prototype variants, the ktests suite x3
# with a spinning-process watcher).
# Manual only (workflow_dispatch; input `only` names the jobs to run, e.g.
# `gh workflow run diag.yml --ref main -f only=D4`); D1-D3 and D5 use no
# checkout and no third-party action, D4/D6/D7/D8/D9 the pinned actions of ci.yml
# (checkout, setup-msys2); every step is `set +e` and bounded by timeout-minutes.
name: diag

on:
  workflow_dispatch:
    inputs:
      only:
        description: "jobs to run (space separated: D1 D2 D3 D4 D5 D6 D7 D8 D9 D10 D11)"
        required: false
        default: "D1 D2 D3"

permissions:
  contents: read

jobs:
  macos:
    name: D1 macos (${{ matrix.slug }})
    # word match: `only=D10` must not run D1
    if: contains(format(' {0} ', inputs.only), ' D1 ')
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: bsd
            brew: bash
          - slug: gnu
            brew: bash coreutils gnu-sed gawk findutils grep diffutils netcat socat
    steps:
      - name: brew install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          BREW_PKGS: ${{ matrix.brew }}
        run: |
          # shellcheck disable=SC2086
          brew install $BREW_PKGS || brew install $BREW_PKGS
      - name: diag L5.4 (read-only)
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          b="$(brew --prefix)/bin/bash"
          echo "== C2: signal dispositions a child bash inherits"
          "$b" -c 'trap -p; trap ": x" PIPE INT QUIT; echo "after set:"; trap -p PIPE INT QUIT'
          echo "== C3: open fds of a child bash"
          "$b" -c 'for f in /dev/fd/*; do [[ -e $f ]] && printf "%s " "${f##*/}"; done; echo'
          lsof -a -p $$ -d 0-99 2>/dev/null
          echo "== C4: ps keywords (one per call)"
          for k in sid sess tsess pgid etimes etime lstart state; do printf '%-7s ' "$k"; ps -o pid= -o "$k=" -p $$ 2>&1 | head -1; done
          "$b" -c 'echo "self=$$ ppid=$PPID"; ps -o pid= -o pgid= -o sess= -p $$; ps -o pid= -o pgid= -o sess= -p $PPID; ( exec perl -MPOSIX -e "POSIX::setsid(); exec q(ps), q(-o), q(pid=), q(-o), q(sess=), q(-p), \$\$" )'
          python3 -c 'import os; print("getsid self", os.getsid(0), "parent", os.getsid(os.getppid()), "pid1", os.getsid(1))'
          echo "== C6: locale variables"
          env | grep -E '^(LANG|LC_)' | sort
          echo "== C5: ERE word boundaries in [[ =~ ]]"
          "$b" -c 're="\\<foo\\>"; [[ "a foo b" =~ $re ]]; echo "\\<foo\\> rc=$?"; re="[[:<:]]foo[[:>:]]"; [[ "a foo b" =~ $re ]]; echo "[[:<:]] rc=$?"; re="\\bfoo\\b"; [[ "a foo b" =~ $re ]]; echo "\\b rc=$?"'
          echo "== C1: timeout names"
          for t in timeout gtimeout; do printf '%s: ' "$t"; command -v "$t" || echo "-"; done
          ls -l "$(brew --prefix)/opt/coreutils/libexec/gnubin/timeout" 2>&1

  ubuntu:
    name: D2 ubuntu host
    if: contains(inputs.only, 'D2')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: diag L5.4 (read-only, ubuntu host)
        timeout-minutes: 3
        run: |
          set +e
          grep -E '^Sig(Ign|Blk|Cgt)' /proc/$$/status
          bash -c 'grep -E "^SigIgn" /proc/$$/status; trap ": x" PIPE; trap -p PIPE'
          ls -l /proc/$$/fd
          bash -c 'ls -l /proc/$$/fd'
          readlink -f "$(command -v env)"; env --version 2>&1 | head -1
          env --default-signal=INT,QUIT,PIPE bash -c 'grep -E "^SigIgn" /proc/$$/status; trap ": x" PIPE; trap -p PIPE'; echo "env --default-signal=INT,QUIT,PIPE rc=$?"

  windows:
    name: D3 windows
    if: contains(inputs.only, 'D3')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: diag L5.4 (read-only, NtSuspendProcess)
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          ( exec sleep 60 ) </dev/null >/dev/null 2>&1 & p=$!
          sleep 1; w=$(cat /proc/$p/winpid); echo "pid $p winpid $w"
          ps1="$(cygpath -u "$SYSTEMROOT")/System32/WindowsPowerShell/v1.0/powershell.exe"
          c="$(cygpath -w "$RUNNER_TEMP")"
          MSYS2_ARG_CONV_EXCL='*' TEMP="$c" TMP="$c" timeout -k 5 90 "$ps1" -NoProfile -NonInteractive -Command "Add-Type -Name N -Namespace W -MemberDefinition '[DllImport(\"ntdll.dll\")] public static extern int NtSuspendProcess(IntPtr h);'; \$q=Get-Process -Id $w; 'NtSuspendProcess=' + [W.N]::NtSuspendProcess(\$q.Handle); (Get-Process -Id $w).Threads | ForEach-Object { \$_.ThreadState.ToString() + '/' + \$_.WaitReason }"
          echo "powershell rc=$?"
          kill -KILL "$p"; sleep 1
          kill -0 "$p" 2>/dev/null && echo "deaf=yes" || echo "deaf=no"
          /usr/bin/kill -f -9 "$p" 2>/dev/null; wait "$p" 2>/dev/null; true

  windows057:
    name: D4 windows 057 (${{ matrix.slug }})
    if: contains(inputs.only, 'D4')
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: git-bash
          - slug: msys2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: MSYS2 (msys2 row)
        if: matrix.slug == 'msys2'
        id: m2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          update: false
          path-type: minimal
          install: git gnu-netcat gawk diffutils findutils grep sed curl openssl perl util-linux

      # the suspend of 057's drv_deaf in every runtime on the runner, every output visible
      - name: D4a suspend probe per runtime
        timeout-minutes: 8
        shell: bash
        env:
          M2LOC: ${{ steps.m2.outputs.msys2-location }}
        run: |
          set +e
          unset MSYSTEM
          T="$(cygpath -u "$RUNNER_TEMP")/d4"; mkdir -p "$T"
          cat > "$T/sus.sh" <<'SUS'
          # sus.sh DIR MODE — MODE plain (sleep), copy (a sleep copy kt057probe.exe in DIR),
          # copyws (copy + the Start-Process watchdog of drv_deaf)
          d="$1" mode="$2"
          echo "-- mode=$mode bash=$BASH_VERSION uname=$(uname -r) BASH=$BASH"
          echo "   PATH=$PATH"
          echo "   SYSTEMROOT=${SYSTEMROOT:-<unset>} WINDIR=${WINDIR:-<unset>} TEMP=${TEMP:-<unset>} TMP=${TMP:-<unset>}"
          x=sleep
          if [[ "$mode" != plain ]]; then rm -f "$d/kt057probe.exe"; cp /usr/bin/sleep.exe "$d/kt057probe.exe"; x="$d/kt057probe.exe"; fi
          bash -c '("$1" 60) </dev/null >/dev/null 2>&1 & echo "$!" > "$2"' _ "$x" "$d/cpid"
          read -r p < "$d/cpid"; sleep 1.5
          w=""; read -r w < "/proc/$p/winpid"
          c="$(tr '\0' ' ' < "/proc/$p/cmdline" 2>&1)"
          echo "   pid=$p winpid=$w cmdline=[$c] exename=[$(cat /proc/$p/exename 2>&1)]"
          ps="$(cygpath -u "${SYSTEMROOT:-C:\Windows}")/System32/WindowsPowerShell/v1.0/powershell.exe"
          [[ -x "$ps" ]] || ps=powershell.exe
          cw="$(cygpath -w "$d")"
          ws=""
          [[ "$mode" == copyws ]] && ws="Start-Process powershell -WindowStyle Hidden -ArgumentList '-NoProfile','-NonInteractive','-Command',('\$q=Get-Process -Id $w -EA 0; if(\$q -and -not \$q.WaitForExit(120000)){ \$q.Kill() }'); 'watchdog started';"
          t0=$SECONDS
          MSYS2_ARG_CONV_EXCL='*' TEMP="$cw" TMP="$cw" timeout -k 5 90 "$ps" -NoProfile -NonInteractive -Command "Add-Type -Name N -Namespace W -MemberDefinition '[DllImport(\"ntdll.dll\")] public static extern int NtSuspendProcess(IntPtr h);'; \$q=Get-Process -Id $w; 'proc=' + \$q.Path; 'NtSuspendProcess=' + [W.N]::NtSuspendProcess(\$q.Handle); 'threads=' + (((Get-Process -Id $w).Threads | ForEach-Object { \$_.ThreadState.ToString() + '/' + \$_.WaitReason }) -join ' '); $ws 'ps-done'" 2>&1 | sed 's/^/   ps| /'
          echo "   powershell rc=${PIPESTATUS[0]} took=$(( SECONDS - t0 ))s"
          kill -KILL "$p"; echo "   kill -KILL rc=$?"; sleep 1
          kill -0 "$p" 2>/dev/null && echo "   deaf=yes" || echo "   deaf=no"
          w2=""; { read -r w2 < "/proc/$p/winpid"; } 2>/dev/null; echo "   /proc/$p/winpid now=[$w2]"
          MSYS2_ARG_CONV_EXCL='*' timeout -k 5 60 "$ps" -NoProfile -NonInteractive -Command "if(Get-Process -Id $w -EA 0){'   winproc=alive ' + (((Get-Process -Id $w).Threads | ForEach-Object { \$_.ThreadState.ToString() + '/' + \$_.WaitReason }) -join ' ')}else{'   winproc=gone'}; if(\$q=Get-Process -Id $w -EA 0){ \$q.Kill(); '   killed from powershell' }" 2>&1
          "${BASH%/*}/kill" -f -9 "$p" 2>/dev/null; true
          SUS
          G="/c/Program Files/Git/usr/bin/bash.exe"
          bashes=( "$G" /c/msys64/usr/bin/bash.exe )
          [[ -n "$M2LOC" ]] && bashes+=( "$(cygpath -u "$M2LOC")/usr/bin/bash.exe" )
          for b in "${bashes[@]}"; do
            echo "==== $b"
            [[ -x "$b" ]] || { echo "   (absent)"; continue; }
            ls -l "${b%/*}/msys-2.0.dll"; md5sum "${b%/*}/msys-2.0.dll" "${b%/*}/sleep.exe"
            for m in plain copy copyws; do
              PATH="${b%/*}:$PATH" timeout -k 5 150 "$b" "$T/sus.sh" "$T" "$m"
            done
            echo "== env -i (gate cell like: PATH, SYSTEMROOT, WINDIR, own TEMP/TMP/HOME), mode copyws"
            mkdir -p "$T/cell/tmp" "$T/cell/home"
            timeout -k 5 150 env -i "PATH=${b%/*}:$PATH" "SYSTEMROOT=$SYSTEMROOT" "WINDIR=$WINDIR" "TEMP=$T/cell/tmp" "TMP=$T/cell/tmp" "TMPDIR=$T/cell/tmp" "HOME=$T/cell/home" "$b" "$T/sus.sh" "$T/cell/tmp" copyws
          done
          true

      # 057 itself, run directly (no gate) by the row's bash
      - name: D4b 057 directly
        timeout-minutes: 10
        shell: bash
        env:
          M2LOC: ${{ steps.m2.outputs.msys2-location }}
        run: |
          set +e
          unset MSYSTEM
          if [[ -n "$M2LOC" ]]; then b="$(cygpath -u "$M2LOC")/usr/bin/bash.exe"; else b="/c/Program Files/Git/usr/bin/bash.exe"; fi
          echo "row bash: $b"
          PATH="${b%/*}:$PATH" timeout -k 10 500 "$b" ktests/tests/057_GateDeafStop.sh 2>&1
          echo "057 rc=$?"
          true

  windows057ps:
    name: D5 windows powershell timing (git-bash)
    if: contains(inputs.only, 'D5')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 057's suspend = powershell + Add-Type; D4 (run 41032204154): 0-6 s from Git's
      # bash with the step's env, ~20 s from C:\msys64's bash, 36 s under env -i.
      # Which part is slow (start-up, Get-Process, Add-Type), in which env?
      - name: D5 powershell timing per env
        timeout-minutes: 25
        shell: bash
        run: |
          set +e
          unset MSYSTEM
          T="$(cygpath -u "$RUNNER_TEMP")/d5"; mkdir -p "$T/tmp" "$T/home" "$T/etc"
          cat > "$T/pst.sh" <<'PST'
          # pst.sh LABEL — time one powershell call of 057's shape (TEMP/TMP of its own)
          ps="$(cygpath -u "${SYSTEMROOT:-C:\Windows}")/System32/WindowsPowerShell/v1.0/powershell.exe"
          cw="$(cygpath -w "$D5T/tmp")"
          t0=${EPOCHREALTIME/[.,]/}
          MSYS2_ARG_CONV_EXCL='*' TEMP="$cw" TMP="$cw" timeout -k 5 120 "$ps" -NoProfile -NonInteractive -Command "\$sw=[Diagnostics.Stopwatch]::StartNew(); 'startup_ms=' + [int]([DateTime]::Now - [Diagnostics.Process]::GetCurrentProcess().StartTime).TotalMilliseconds; \$a=\$sw.ElapsedMilliseconds; \$p=Get-Process -Id \$PID; 'getprocess_ms=' + (\$sw.ElapsedMilliseconds-\$a); \$a=\$sw.ElapsedMilliseconds; Add-Type -Name N -Namespace W -MemberDefinition '[DllImport(\"ntdll.dll\")] public static extern int NtSuspendProcess(IntPtr h);'; 'addtype_ms=' + (\$sw.ElapsedMilliseconds-\$a); \$a=\$sw.ElapsedMilliseconds; \$null=[Diagnostics.Process]::Start((New-Object Diagnostics.ProcessStartInfo -Property @{FileName='cmd.exe'; Arguments='/c exit'; WindowStyle='Hidden'; UseShellExecute=\$false})); 'dotnetstart_ms=' + (\$sw.ElapsedMilliseconds-\$a); 'PSModulePath=' + \$env:PSModulePath; 'LocalAppData=' + [Environment]::GetFolderPath('LocalApplicationData'); 'USERPROFILE=' + \$env:USERPROFILE" </dev/null 2>&1 | tr -d '\r' | tr '\n' ' '
          echo "| rc=${PIPESTATUS[0]} wall_ms=$(( (${EPOCHREALTIME/[.,]/} - t0) / 1000 )) [$1] runtime=$(uname -r)"
          PST
          G="/c/Program Files/Git/usr/bin/bash.exe" M=/c/msys64/usr/bin/bash.exe
          w() { cygpath -w "$1"; }
          cell=( "SYSTEMROOT=$SYSTEMROOT" "WINDIR=$WINDIR" "D5T=$T" "HOME=$T/home" "TMPDIR=$T/tmp" "TMP=$T/tmp" "TEMP=$T/tmp" "USERPROFILE=$T/home" "ProgramData=$T/etc" )
          echo "LOCALAPPDATA=$LOCALAPPDATA APPDATA=$APPDATA USERPROFILE=$USERPROFILE ProgramData=$PROGRAMDATA ProgramFiles=$PROGRAMFILES"
          echo "PSModulePath=$PSModulePath"
          export D5T="$T"
          for r in 1 2; do
            echo "==== round $r"
            PATH="${G%/*}:$PATH" "$G" "$T/pst.sh" git-full
            PATH="${M%/*}:$PATH" "$M" "$T/pst.sh" m64-full
            env -i "PATH=${G%/*}:$PATH" "${cell[@]}" "$G" "$T/pst.sh" git-cell
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "$M" "$T/pst.sh" m64-cell
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "LOCALAPPDATA=$LOCALAPPDATA" "APPDATA=$APPDATA" "$M" "$T/pst.sh" m64-cell+LOCALAPPDATA,APPDATA
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "USERPROFILE=$USERPROFILE" "$M" "$T/pst.sh" m64-cell+USERPROFILE
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "ProgramData=$PROGRAMDATA" "$M" "$T/pst.sh" m64-cell+ProgramData
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "ProgramFiles=$PROGRAMFILES" "$M" "$T/pst.sh" m64-cell+ProgramFiles
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "PSModulePath=$(w "$SYSTEMROOT")\System32\WindowsPowerShell\v1.0\Modules" "$M" "$T/pst.sh" m64-cell+PSModulePath=System32
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "PSModulePath=$PSModulePath" "$M" "$T/pst.sh" m64-cell+PSModulePath=step
            env -i "PATH=${M%/*}:$PATH" "${cell[@]}" "LOCALAPPDATA=$LOCALAPPDATA" "APPDATA=$APPDATA" "USERPROFILE=$USERPROFILE" "ProgramData=$PROGRAMDATA" "ProgramFiles=$PROGRAMFILES" "$M" "$T/pst.sh" m64-cell+all5
            env -i "PATH=${G%/*}:$PATH" "${cell[@]}" "LOCALAPPDATA=$LOCALAPPDATA" "APPDATA=$APPDATA" "USERPROFILE=$USERPROFILE" "ProgramData=$PROGRAMDATA" "ProgramFiles=$PROGRAMFILES" "$G" "$T/pst.sh" git-cell+all5
          done
          echo "==== m64 full env vs git full env (names only, sorted diff)"
          diff <(PATH="${G%/*}:$PATH" "$G" -c 'env | cut -d= -f1 | sort') <(PATH="${M%/*}:$PATH" "$M" -c 'env | cut -d= -f1 | sort')
          true

  windows057fix:
    name: D6 windows 057 fixed (${{ matrix.slug }})
    if: contains(inputs.only, 'D6')
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: git-bash
          - slug: msys2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: MSYS2 (msys2 row)
        if: matrix.slug == 'msys2'
        id: m2
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MSYS
          update: false
          path-type: minimal
          install: git gnu-netcat gawk diffutils findutils grep sed curl openssl perl util-linux

      # SV-1's uncommitted fix (057 + its fixtures deaf/deafjob: .NET calls instead of
      # cmdlets; 051 budget; 042/044 failure detail), applied to the checkout only
      - name: D6a apply the SV-1 patch to ktests
        shell: bash
        run: |
          base64 -d > "$RUNNER_TEMP/sv1.patch.gz" <<'B64'
          H4sICMVn5GoCA3N2MS5wYXRjaADtW+ty28aS/s+n6MB0QFgEeNHNEk1vZEnHVtm6lKjEJyVqKQgYkliSAIIBRXEVpfYh9gn3Sba7
