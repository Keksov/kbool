          gzip -dc "$RUNNER_TEMP/sv1.patch.gz" | git -C ktests apply -v
          git -C ktests status --short

      - name: D6b 057 directly (row bash, verbose)
        timeout-minutes: 12
        shell: bash
        env:
          M2LOC: ${{ steps.m2.outputs.msys2-location }}
        run: |
          set +e
          unset MSYSTEM
          if [[ -n "$M2LOC" ]]; then b="$(cygpath -u "$M2LOC")/usr/bin/bash.exe"; else b="/c/Program Files/Git/usr/bin/bash.exe"; fi
          echo "row bash: $b"
          t0=$SECONDS
          PATH="${b%/*}:$PATH" timeout -k 10 600 "$b" ktests/tests/057_GateDeafStop.sh -v info 2>&1 | grep -aE 'PASS|FAIL|Total|Passed|Failed'
          echo "057 rc=${PIPESTATUS[0]} dt=$(( SECONDS - t0 ))s"
          true

      - name: D6c gate ktests (as ci.yml, ktests only)
        if: matrix.slug == 'git-bash'
        timeout-minutes: 25
        shell: bash
        env:
          M2LOC: ${{ steps.m2.outputs.msys2-location }}
        run: |
          set +e
          unset MSYSTEM
          if [[ -n "$M2LOC" ]]; then b="$(cygpath -u "$M2LOC")/usr/bin/bash.exe"; else b="/c/Program Files/Git/usr/bin/bash.exe"; fi
          OUT="$(cygpath -u "$RUNNER_TEMP")/gate-out"; mkdir -p "$OUT"
          export KT_GATE_BASHES="$(cygpath -m "$b")"
          PATH="${b%/*}:$PATH" timeout -k 30 1300 "$b" ktests/tools/gate.sh --out "$OUT" --rerun-failed 1 --timeout 900 ktests 2>&1 | tail -n 15
          echo "gate rc=${PIPESTATUS[0]}"
          for f in "$OUT"/cells/*/log.txt "$OUT"/cells/*/rerun-*/log.txt; do [[ -f "$f" ]] && { echo "== $f"; grep -a 'FAIL' "$f" | cut -c1-600; }; done
          true

      # the msys2 row's gate from the msys2 shell, as ci.yml (D6 run 41036267295 started it
      # from Git's bash: a mixed-runtime launch, the cell hung with no test started)
      - name: D6d gate ktests (msys2 shell, as ci.yml, ktests only)
        if: matrix.slug == 'msys2'
        timeout-minutes: 25
        shell: msys2 {0}
        run: |
          set +e
          OUT="$(cygpath -u "$RUNNER_TEMP")/gate-out"; mkdir -p "$OUT"
          export KT_GATE_BASHES=/usr/bin/bash
          timeout -k 30 1300 /usr/bin/bash ktests/tools/gate.sh --out "$OUT" --rerun-failed 1 --timeout 900 ktests 2>&1 | tail -n 15
          echo "gate rc=${PIPESTATUS[0]}"
          for f in "$OUT"/cells/*/log.txt "$OUT"/cells/*/rerun-*/log.txt; do [[ -f "$f" ]] && { echo "== $f"; grep -a 'FAIL' "$f" | cut -c1-600; }; done
          true

  macosproc:
    name: D7 macos proc (${{ matrix.slug }})
    if: contains(inputs.only, 'D7')
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: bsd
            brew: bash
            gnubin: "no"
          - slug: gnu
            brew: bash coreutils gnu-sed gawk findutils grep diffutils netcat socat
            gnubin: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: brew install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          BREW_PKGS: ${{ matrix.brew }}
        run: |
          # shellcheck disable=SC2086
          brew install $BREW_PKGS || brew install $BREW_PKGS

