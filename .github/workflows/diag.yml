            echo "== $t rc=$?"
            perl -pe 's/\e\[[0-9;]*m//g' "$RUNNER_TEMP/$t.log" | grep -aE 'FAIL|N/A|state|auto|this C library|Total|Passed|Failed' | cut -c1-600
          done
          true

      # the kcl/tregex suite through the gate, as ci.yml's macOS rows run it
      - name: D8d gate kcl/tregex (as ci.yml)
        timeout-minutes: 15
        shell: bash
        env:
          GNUBIN: ${{ matrix.gnubin }}
        run: |
          set +e
          out="$RUNNER_TEMP/gate-out"; mkdir -p "$out"
          brewbash="$(brew --prefix)/bin/bash"
          export KT_GATE_BASHES="$brewbash"
          if [ "$GNUBIN" = yes ]; then PATH="$PATH:$(brew --prefix coreutils)/libexec/gnubin"; export PATH; fi
          "$brewbash" ktests/tools/gate.sh --out "$out" --rerun-failed 1 --timeout 900 kcl/tregex 2>&1 | tail -n 15
          echo "gate rc=${PIPESTATUS[0]}"
          for f in "$out"/cells/*/log.txt "$out"/cells/*/rerun-*/log.txt; do [ -f "$f" ] && { echo "== $f"; grep -a 'FAIL' "$f" | cut -c1-900; }; done
          true

  kklasshang:
    name: D9 macos kklass hang (${{ matrix.slug }})
    if: contains(inputs.only, 'D9')
    runs-on: macos-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: bsd
            brew: bash
            gnubin: "no"
          - slug: gnu
            brew: bash coreutils gnu-sed gawk findutils grep diffutils netcat socat
            gnubin: "yes"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: brew install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          BREW_PKGS: ${{ matrix.brew }}
        run: |
          # shellcheck disable=SC2086
          brew install $BREW_PKGS || brew install $BREW_PKGS

      # L5.4-14's uncommitted kklass/tests change (empty: none), applied to the checkout only
