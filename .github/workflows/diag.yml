          git -C kklass status --short

      # a bounded runner: CMD in its own process group; past SNAP s one dump of its
      # process tree (ps + the fds lsof sees), past BOUND s the dump, then TERM/KILL
      - name: D9b the bounded runner
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/d9.sh" <<'D9'
          set -m
          tree() {  # PID -> PID and its descendants, plus its process group
            ps -axo pid=,ppid=,pgid= | awk -v r="$1" '{ pp[$1] = $2; pg[$1] = $3 }
              END { for (p in pp) { if (pg[p] == r) { print p; continue }
                    q = p; n = 0; while ((q in pp) && n < 64) { if (q == r) { print p; break }; q = pp[q]; n++ } } }'
          }
          dump() {  # PID
            local l q k=0; l=" $(tree "$1" | tr '\n' ' ') "
            ps -axo pid=,ppid=,pgid=,stat=,etime=,command= | awk -v l="$l" 'index(l, " " $1 " ")' | cut -c1-400
            for q in $l; do
              (( ++k > 12 )) && break
              echo "   -- lsof $q"; lsof -n -P -p "$q" 2>/dev/null | awk 'NR > 1 && $4 ~ /^[0-9]+[rwu]/' | cut -c1-220 | head -15
            done
          }
          run() {  # BOUND SNAP LOG CMD... -> RC DT (s); a watchdog group, no polling
            local n=$1 snap=$2 log=$3 p wd t0=$SECONDS; shift 3
            rm -f "$RUNNER_TEMP/d9.hit"
            "$@" > "$log" 2>&1 < /dev/null & p=$!
            (
              if (( snap > 0 && snap < n )); then
                sleep "$snap"; echo "   still running after ${snap}s, process tree of $p:"; dump "$p"; sleep $(( n - snap ))
              else sleep "$n"; fi
              : > "$RUNNER_TEMP/d9.hit"; echo "   TIMEOUT ${n}s, process tree of $p:"; dump "$p"
              l=$(tree "$p" | tr '\n' ' ')
              kill -TERM -- "-$p" 2>/dev/null; kill -TERM $l 2>/dev/null; sleep 2
              kill -KILL -- "-$p" 2>/dev/null; kill -KILL $l 2>/dev/null
            ) & wd=$!
            wait "$p" 2>/dev/null; RC=$?
            kill -TERM -- "-$wd" 2>/dev/null; wait "$wd" 2>/dev/null
            [[ -e $RUNNER_TEMP/d9.hit ]] && RC=124; DT=$(( SECONDS - t0 ))
          }
          strip() { perl -pe 's/\e\[[0-9;]*[A-Za-z]//g' "$1"; }
          b=$(brew --prefix)/bin/bash
          mode=$1 reps=$2 bound=$3
          case $mode in
            files)
              for (( pass = 1; pass <= reps; pass++ )); do
                bad=""; t1=$SECONDS
                for f in kklass/tests/[0-9]*.sh; do
                  t=${f##*/}; t=${t%.sh}
                  run "$bound" 0 "$RUNNER_TEMP/$t.log" "$b" "$f"
                  printf 'pass %s %-36s rc=%-3s dt=%ss\n' "$pass" "$t" "$RC" "$DT"
                  if (( RC != 0 )); then bad+=" $t($RC)"; strip "$RUNNER_TEMP/$t.log" | tail -n 20 | cut -c1-600 | sed 's/^/   | /'; fi
                done
                echo "== pass $pass done in $(( SECONDS - t1 ))s, rc != 0:${bad:- none}"
              done ;;
            suite)
              for (( i = 1; i <= reps; i++ )); do
                run "$bound" 0 "$RUNNER_TEMP/suite-$i.log" "$b" kklass/tests/tests.sh
                echo "== suite run $i rc=$RC dt=${DT}s"
                strip "$RUNNER_TEMP/suite-$i.log" | grep -aE 'FAIL|Total|Passed|Failed' | cut -c1-600
              done ;;
            gate)
              out="$RUNNER_TEMP/gate-out"; mkdir -p "$out"
              export KT_GATE_BASHES="$b"
              run "$bound" "$reps" "$RUNNER_TEMP/gate.log" "$b" ktests/tools/gate.sh --out "$out" --rerun-failed 1 --timeout 600 kklass
              echo "== gate rc=$RC dt=${DT}s"; tail -n 15 "$RUNNER_TEMP/gate.log"
              for f in "$out"/cells/*/log.txt "$out"/cells/*/rerun-*/log.txt; do
                [ -f "$f" ] && { echo "== $f"; strip "$f" | grep -a 'FAIL' | cut -c1-900; }
              done ;;
          esac
          D9
          echo "driver: $(wc -l < "$RUNNER_TEMP/d9.sh") lines"

      # 139 S25's FIFO helper (s25src, from the patched checkout) on Darwin: a delivered text, a lone
      # reader (the writer never opens: the watchdog's read-write open releases it, 5 tries), a stuck
      # reader (no release: the watchdog kills the script after 30 s with its message)
      - name: D9f the S25 FIFO watchdog on Darwin (ok, lone, stuck)
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          b="$(brew --prefix)/bin/bash"; d="$RUNNER_TEMP/fp"; mkdir -p "$d"
          awk '/^s25src\(\) \{/{f=1} f{print} f&&/^}$/{exit}' kklass/tests/139_ClassDeclarationSites.sh > "$d/fn.sh"
          cat > "$d/neg.sh" <<'NEG'
          d=$1 mode=$2
          src=$(<"$d/fn.sh")
          wr='printf '"'"'%s\ns25got=$?\n'"'"' "$2" > "$f"'
          rd=': 2>/dev/null 1<>"$f"'
          [[ $src == *"$wr"* && $src == *"$rd"* ]] || { echo "pattern miss"; exit 9; }
          case $mode in
            lone)  src=${src/"$wr"/exit 1} ;;
            stuck) src=${src/"$wr"/exit 1}; src=${src/"$rd"/:} ;;
          esac
          eval "$src"
          rm -f "$d/q"; mkfifo "$d/q"
          t0=$SECONDS; s25src "$d/q" 'echo text-ran' "$d/e"; echo "mode=$mode r=$r got=[$s25got] dt=$((SECONDS-t0)) err=[$(<"$d/e")]"
          NEG
          for m in ok lone stuck; do
            t0=$SECONDS; "$b" "$d/neg.sh" "$d" "$m" 2>&1; echo "  $m: rc=$? dt=$(( SECONDS - t0 ))s"
          done
          true

      - name: D9c every kklass test file directly, 3 passes (bound 180 s each)
        timeout-minutes: 45
        shell: bash
        env:
          GNUBIN: ${{ matrix.gnubin }}
        run: |
          set +e
          if [ "$GNUBIN" = yes ]; then PATH="$PATH:$(brew --prefix coreutils)/libexec/gnubin"; export PATH; fi
          "$(brew --prefix)/bin/bash" "$RUNNER_TEMP/d9.sh" files 3 180
          true

      - name: D9d the kklass suite threaded (tests.sh), 5 runs (bound 420 s each)
        timeout-minutes: 25
        shell: bash
        env:
          GNUBIN: ${{ matrix.gnubin }}
        run: |
          set +e
          if [ "$GNUBIN" = yes ]; then PATH="$PATH:$(brew --prefix coreutils)/libexec/gnubin"; export PATH; fi
          "$(brew --prefix)/bin/bash" "$RUNNER_TEMP/d9.sh" suite 5 420
          true

      # the kklass suite through the gate, as ci.yml's macOS rows run it (cell timeout 600 s;
      # one process-tree dump at 500 s if it still runs)
      - name: D9e gate kklass (as ci.yml, kklass only)
        timeout-minutes: 20
        shell: bash
        env:
          GNUBIN: ${{ matrix.gnubin }}
        run: |
          set +e
          if [ "$GNUBIN" = yes ]; then PATH="$PATH:$(brew --prefix coreutils)/libexec/gnubin"; export PATH; fi
          "$(brew --prefix)/bin/bash" "$RUNNER_TEMP/d9.sh" gate 500 900
          true

  # D10 = L5.8 (ledger L56-o2): the Git-bash ktests cell leaves an orphan /usr/bin/bash.
  # Git-bash row as ci.yml (private MSYS2 for nc only). A sampler (snap.sh) logs the
  # cygwin process table every 0.5 s (new pid / exec / gone, with ppid pgid sid winpid
  # and argv); after each run orph.sh names every orphan born in it with its sampled
  # ancestry (the test file that made it) and its Windows view, then KILLs it by pid.
  ktestsstray:
    name: D10 windows git-bash ktests stray
    if: contains(inputs.only, 'D10')
    runs-on: windows-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
