# tools/bench/ci.conf -- what .github/workflows/bench.yml runs on a push to the
# `perf` branch (a manual run's non-empty inputs override these). Sourced by sh.
#   ONLY    job groups: linux macos windows
#   SIDES   bench sides, prepare.sh specs: NAME=REF[+PATCH] (REF `pointer` = kbool's
#           kklass pointer); the first side is the baseline of every ratio
#   SUITES  bench.sh suites: call drift
#   ROUNDS  rounds per measurement (interleaved over the sides)
ONLY="linux macos windows"
SIDES="cur=pointer again=pointer"
SUITES="call drift"
ROUNDS=5
