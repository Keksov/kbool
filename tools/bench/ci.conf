# tools/bench/ci.conf -- what .github/workflows/bench.yml runs on a push to the
# `perf` branch (a manual run's non-empty inputs override these). Sourced by sh.
#   ONLY    job groups: linux macos windows
#   SIDES   bench sides, prepare.sh specs: NAME=[SUB@]REF[+PATCH][,...] (SUB kklass,
#           the default, kcl or kkore; REF `pointer` = kbool's submodule pointer); the
#           first side is the baseline of every ratio. For the fv suite pin kcl,
#           e.g. SIDES="main=kcl@main cur=pointer"; for the image suite pin kkore
#   SUITES  bench.sh suites: call drift fv fvviews image fvdlg (fvdlg: bin/fvdlg through
#           kk.image --background, stage I5 — pin kkore and kcl as for image)
#   ROUNDS  rounds per measurement (interleaved over the sides)
# Now (kk.image stage I5): the fvdlg suite (bin/fvdlg through the image: hit, plain,
# first call with the background writer) and the image suite, one side (the pointer).
ONLY="linux macos windows"
SIDES="cur=pointer"
SUITES="fvdlg image"
ROUNDS=5
